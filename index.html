<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шумная вечеринка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">

    <section class="arena" aria-label="Очки игроков">
      <ul id="scoreList" class="scoreboard"></ul>
      <p id="emptyMessage" class="empty-message">
        Войдите в комнату, чтобы увидеть игроков
      </p>
    </section>

    <section class="panel">

      <section class="setup">
        <div class="fields">
          <label>
            Имя игрока
            <input
              id="playerName"
              type="text"
              placeholder="Например: Маша"
              maxlength="30"
            >
          </label>

          <label>
            Комната
            <input
              id="roomName"
              type="text"
              value="party-1"
              maxlength="50"
            >
          </label>
        </div>

        <button id="joinButton" type="button">
          Войти в игру
        </button>
      </section>

      <section id="controls" class="controls hidden">
        <p id="status" class="status">
          Нажми «Начать», чтобы включить микрофон
        </p>

        <div class="buttons">
          <button id="startButton" type="button">
            Начать
          </button>

          <button id="stopButton" type="button" disabled>
            Стоп
          </button>
        </div>

        <div class="microphone">
          <span>Микрофон</span>

          <div class="meter-track">
            <div id="meterFill" class="meter-fill"></div>
          </div>
        </div>

        <p class="hint">
          Один громкий всплеск — одно очко
        </p>
      </section>

      <p id="error" class="error hidden" role="alert"></p>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>

</body>
</html>
