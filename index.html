<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Шумная вечеринка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ink: #064967;
      --track: #9bd8e4;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .game {
      padding: 18px 12px 28px;
    }

    .arena {
      overflow-x: auto;
    }

    .players {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 35px;

      width: max-content;
      min-width: 100%;

      margin: 0;
      padding: 0 10px;
      list-style: none;
    }

    .player {
      flex: 0 0 174px;
      width: 174px;
      text-align: center;
    }

    .score {
      height: 48px;

      font-size: 40px;
      line-height: 44px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      height: 350px;
    }

    .track {
      position: absolute;
      top: 0;
      left: 50%;

      width: 94px;
      height: 280px;
      padding: 7px;

      transform: translateX(-50%);
      background: var(--track);
    }

    .track-inner {
      position: relative;
      height: 100%;
    }

    .fill {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;

      height: 0;
      background: var(--color);

      transition: height 250ms ease;
    }

    .avatar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;

      width: 174px;
      height: 180px;
    }

    .avatar svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name {
      margin-top: 7px;
      overflow: hidden;

      font-size: 34px;
      line-height: 42px;
      font-weight: 800;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 55px 12px;
      text-align: center;
      color: #718795;
    }

    .panel {
      width: min(100%, 450px);
      margin: 24px auto 0;
      padding: 18px;

      border: 1px solid #dce8ee;
      border-radius: 16px;
      background: #f5fafc;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label,
    .label {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 11px;

      border: 1px solid #c8dce6;
      border-radius: 9px;

      background: #fff;
      color: var(--ink);
    }

    input:focus {
      outline: 2px solid #9bd8e4;
      outline-offset: 1px;
    }

    input:disabled {
      opacity: 0.7;
    }

    .label {
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .choice {
      padding: 5px;

      border: 3px solid transparent;
      border-radius: 12px;

      background: #fff;
      cursor: pointer;
    }

    .choice[aria-pressed="true"] {
      border-color: var(--ink);
      background: #e7f5fc;
    }

    .choice svg {
      display: block;
      width: 100%;
      height: 72px;
    }

    .choice span {
      display: block;
      padding-bottom: 4px;

      color: var(--ink);
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .action {
      flex: 1;
      padding: 12px;

      border: 0;
      border-radius: 10px;

      background: #279e45;
      color: #fff;

      font-weight: 700;
      cursor: pointer;
    }

    #stop {
      background: #dc4b43;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin: 14px 0 0;
      text-align: center;
      font-size: 13px;
    }

    .meter {
      height: 8px;
      margin-top: 12px;
      overflow: hidden;

      border-radius: 99px;
      background: #dce8ee;
    }

    .meter-fill {
      width: 0;
      height: 100%;
      background: #38b65a;
    }

    .hint {
      margin: 12px 0 0;
      color: #718795;
      font-size: 12px;
      text-align: center;
    }

    .error {
      margin: 12px 0 0;
      color: #bd3030;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 420px) {
      .players {
        justify-content: flex-start;
        gap: 16px;
        padding: 0;
      }

      .fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="game">

    <section class="arena" aria-label="Очки игроков">
      <ul id="players" class="players"></ul>

      <p id="empty" class="empty">
        Выберите аватар и нажмите «Начать»
      </p>
    </section>

    <section class="panel">

      <div class="fields">
        <label for="name">
          Имя игрока
          <input
            id="name"
            type="text"
            placeholder="Маша"
            maxlength="30"
          >
        </label>

        <label for="room">
          Комната
          <input
            id="room"
            type="text"
            value="party-1"
            maxlength="50"
          >
        </label>
      </div>

      <div class="label">Выберите аватар</div>
      <div id="choices" class="choices"></div>

      <div class="actions">
        <button id="start" class="action" type="button" disabled>
          Начать
        </button>

        <button id="stop" class="action" type="button" disabled>
          Стоп
        </button>
      </div>

      <p id="status" class="status">
        Подключение…
      </p>

      <div class="meter">
        <div id="meter" class="meter-fill"></div>
      </div>

      <p class="hint">
        Один громкий всплеск — одно очко.
        Обновление страницы обнуляет ваш результат.
      </p>

      <p id="error" class="error" role="alert"></p>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://juchryyubxkuapnaqelj.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_l75mr1kAzXwX6aPUEvruEA_GfmLKIE-";

      const STORAGE_KEY = "noise-party-player-v2";

      // При 100 очках шкала заполнена полностью.
      const MAX_SCORE = 100;

      // Порог начала и окончания громкого звука.
      const LOUD_START = 35;
      const LOUD_END = 25;

      // Пауза между начислениями.
      const COOLDOWN_MS = 1000;

      const AVATARS = {
        green: {
          label: "Зелёный",
          color: "#cbf477",
          skin: "#f8d2ae",
          hat: "#239b40",
          robot: false
        },

        red: {
          label: "Красный",
          color: "#e69a50",
          skin: "#f8d2ae",
          hat: "#f44037",
          robot: false
        },

        blue: {
          label: "Робот",
          color: "#89bfff",
          skin: "#badcff",
          hat: "#4389e8",
          robot: true
        },

        purple: {
          label: "Фиолетовый",
          color: "#cfafff",
          skin: "#f4cbe9",
          hat: "#9955d9",
          robot: false
        }
      };

      const $ = id => document.getElementById(id);

      let db = null;

      let selectedAvatar = "green";
      let identity = null;

      let context = null;
      let stream = null;
      let analyser = null;
      let frame = null;

      let running = false;
      let busy = false;
      let saving = false;
      let loud = false;

      let lastPoint = -Infinity;

      let channel = null;
      let timer = null;
      let loadVersion = 0;

      const cards = new Map();

      function showError(error) {
        console.error(error);

        $("error").textContent =
          error?.message || String(error);
      }

      function clearError() {
        $("error").textContent = "";
      }

      function avatarSVG(key) {
        const avatar = AVATARS[key] || AVATARS.green;

        if (avatar.robot) {
          return `
            <svg
              viewBox="0 0 180 190"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <g
                stroke="#123e52"
                stroke-width="5"
                stroke-linejoin="round"
              >
                <path
                  d="M90 35V18"
                  fill="none"
                />

                <circle
                  cx="90"
                  cy="14"
                  r="9"
                  fill="${avatar.hat}"
                />

                <rect
                  x="14"
                  y="80"
                  width="22"
                  height="48"
                  rx="7"
                  fill="${avatar.hat}"
                />

                <rect
                  x="144"
                  y="80"
                  width="22"
                  height="48"
                  rx="7"
                  fill="${avatar.hat}"
                />

                <rect
                  x="29"
                  y="39"
                  width="122"
                  height="131"
                  rx="30"
                  fill="${avatar.skin}"
                />

                <rect
                  x="43"
                  y="63"
                  width="94"
                  height="48"
                  rx="17"
                  fill="white"
                />

                <circle
                  cx="66"
                  cy="87"
                  r="9"
                  fill="#123e52"
                />

                <circle
                  cx="114"
                  cy="87"
                  r="9"
                  fill="#123e52"
                />

                <rect
                  x="57"
                  y="130"
                  width="66"
                  height="18"
                  rx="6"
                  fill="${avatar.hat}"
                />
              </g>
            </svg>
          `;
        }

        return `
          <svg
            viewBox="0 0 180 190"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <g
              stroke="#123e52"
              stroke-width="5"
              stroke-linejoin="round"
            >
              <circle
                cx="30"
                cy="112"
                r="17"
                fill="${avatar.skin}"
              />

              <circle
                cx="150"
                cy="112"
                r="17"
                fill="${avatar.skin}"
              />

              <ellipse
                cx="90"
                cy="112"
                rx="61"
                ry="67"
                fill="${avatar.skin}"
              />

              <path
                d="
                  M27 83
                  Q19 15 90 13
                  Q161 15 153 83
                  L133 89
                  H47
                  Z
                "
                fill="${avatar.hat}"
              />

              <ellipse
                cx="90"
                cy="71"
                rx="54"
                ry="20"
                fill="${avatar.hat}"
              />

              <circle
                cx="90"
                cy="42"
                r="20"
                fill="white"
              />

              <path
                d="M80 43L88 51L103 32"
                fill="none"
                stroke="${avatar.hat}"
                stroke-width="7"
              />

              <ellipse
                cx="68"
                cy="104"
                rx="13"
                ry="19"
                fill="white"
              />

              <ellipse
                cx="112"
                cy="104"
                rx="13"
                ry="19"
                fill="white"
              />

              <ellipse
                cx="70"
                cy="108"
                rx="5"
                ry="10"
                fill="#123e52"
              />

              <ellipse
                cx="110"
                cy="108"
                rx="5"
                ry="10"
                fill="#123e52"
              />

              <ellipse
                cx="90"
                cy="126"
                rx="23"
                ry="17"
                fill="${avatar.skin}"
              />

              <path
                d="M62 148Q90 176 118 148Z"
                fill="white"
              />
            </g>
          </svg>
        `;
      }

      function renderChoices() {
        for (const [key, avatar] of Object.entries(AVATARS)) {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "choice";
          button.dataset.avatar = key;

          button.setAttribute(
            "aria-pressed",
            String(key === selectedAvatar)
          );

          // Здесь используются только фиксированные SVG.
          button.innerHTML =
            avatarSVG(key) +
            `<span>${avatar.label}</span>`;

          button.addEventListener("click", () => {
            if (running || busy) return;

            selectedAvatar = key;
            updateChoices();

            $("status").textContent =
              "Аватар выбран. Нажмите «Начать», чтобы применить.";
          });

          $("choices").appendChild(button);
        }
      }

      function updateChoices() {
        document.querySelectorAll(".choice").forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.avatar === selectedAvatar)
          );

          button.disabled = running || busy;
        });
      }

      function updateControls() {
        $("start").disabled = busy || running;
        $("stop").disabled = !running;

        $("name").disabled =
          busy || running || Boolean(identity);

        $("room").disabled =
          busy || running || Boolean(identity);

        updateChoices();
      }

      function saveIdentity() {
        sessionStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            ...identity,
            avatar: selectedAvatar
          })
        );
      }

      async function init() {
        busy = true;
        updateControls();

        try {
          if (!window.supabase?.createClient) {
            throw new Error(
              "Не загрузилась библиотека Supabase."
            );
          }

          db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

          // Проверяем доступность хранилища вкладки.
          const testKey = STORAGE_KEY + "-test";
          sessionStorage.setItem(testKey, "1");
          sessionStorage.removeItem(testKey);

          let previous = null;

          try {
            previous = JSON.parse(
              sessionStorage.getItem(STORAGE_KEY) || "null"
            );
          } catch {
            previous = null;
          }

          if (
            previous &&
            typeof previous.name === "string" &&
            typeof previous.room === "string" &&
            previous.name.trim() &&
            previous.room.trim()
          ) {
            identity = {
              name: previous.name,
              room: previous.room
            };

            selectedAvatar = AVATARS[previous.avatar]
              ? previous.avatar
              : "green";

            $("name").value = identity.name;
            $("room").value = identity.room;

            // При обновлении страницы сбрасывается
            // только результат игрока этой вкладки.
            const { error } = await db
              .from("players")
              .update({ score: 0 })
              .eq("room", identity.room)
              .eq("name", identity.name);

            if (error) throw error;

            await loadScores();
            subscribe();

            $("status").textContent =
              "Ваши очки сброшены. Выберите аватар и нажмите «Начать».";
          } else {
            $("status").textContent =
              "Введите имя, выберите аватар и нажмите «Начать».";
          }

          busy = false;
          updateControls();
        } catch (error) {
          showError(error);

          $("status").textContent =
            "Не удалось подготовить игру. Проверьте ошибку ниже.";

          $("start").disabled = true;
          $("stop").disabled = true;
        }
      }

      async function start() {
        if (busy || running) return;

        const name =
          identity?.name || $("name").value.trim();

        const room =
          identity?.room ||
          $("room").value.trim() ||
          "party-1";

        if (!name) {
          showError(new Error("Введите имя игрока."));
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          showError(
            new Error(
              "Микрофон недоступен. Откройте сайт " +
              "по HTTPS в отдельной вкладке."
            )
          );
          return;
        }

        busy = true;
        clearError();

        $("status").textContent =
          "Разрешите доступ к микрофону…";

        updateControls();

        try {
          stream =
            await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: false,
                autoGainControl: false
              }
            });

          const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error(
              "Обработка звука не поддерживается."
            );
          }

          context = new AudioContextClass();
          await context.resume();

          analyser = context.createAnalyser();
          analyser.fftSize = 1024;

          const source =
            context.createMediaStreamSource(stream);

          source.connect(analyser);

          if (!identity) {
            // Первый запуск в этой вкладке:
            // создаём игрока с выбранным аватаром.
            const { error } = await db
              .from("players")
              .upsert(
                {
                  room,
                  name,
                  avatar: selectedAvatar,
                  score: 0
                },
                {
                  onConflict: "room,name"
                }
              );

            if (error) throw error;

            identity = { name, room };
          } else {
            // После «Стоп» можно сменить аватар.
            // Накопленные очки при этом сохраняются.
            const { error } = await db
              .from("players")
              .upsert(
                {
                  room: identity.room,
                  name: identity.name,
                  avatar: selectedAvatar
                },
                {
                  onConflict: "room,name"
                }
              );

            if (error) throw error;
          }

          saveIdentity();

          running = true;
          loud = false;
          lastPoint = -Infinity;

          $("status").textContent =
            identity.name + ": микрофон включён";

          await loadScores();

          if (!channel) {
            subscribe();
          }

          analyse();
        } catch (error) {
          stop();

          if (error.name === "NotAllowedError") {
            showError(
              new Error(
                "Доступ к микрофону запрещён. " +
                "Разрешите его в браузере. Если игра " +
                "открыта в Meleto, проверьте разрешение " +
                "микрофона для iframe."
              )
            );
          } else if (error.name === "NotFoundError") {
            showError(
              new Error(
                "Микрофон не найден. " +
                "Проверьте его подключение."
              )
            );
          } else {
            showError(error);
          }

          $("status").textContent =
            "Не удалось начать игру.";
        } finally {
          busy = false;
          updateControls();
        }
      }

      function stop() {
        running = false;
        loud = false;

        if (frame !== null) {
          cancelAnimationFrame(frame);
          frame = null;
        }

        if (stream) {
          stream.getTracks().forEach(track => {
            track.stop();
          });

          stream = null;
        }

        if (context) {
          const oldContext = context;
          context = null;

          oldContext.close().catch(console.error);
        }

        analyser = null;

        $("meter").style.width = "0%";

        $("status").textContent =
          "Микрофон выключен. Можно выбрать другой аватар.";

        updateControls();
      }

      function analyse() {
        const data =
          new Uint8Array(analyser.fftSize);

        function tick() {
          if (!running || !analyser) return;

          analyser.getByteTimeDomainData(data);

          let sum = 0;

          for (const sample of data) {
            const value = (sample - 128) / 128;
            sum += value * value;
          }

          const level = Math.min(
            100,
            Math.round(
              Math.sqrt(sum / data.length) * 300
            )
          );

          $("meter").style.width = level + "%";

          if (level >= LOUD_START) {
            loud = true;
          } else if (
            loud &&
            level < LOUD_END
          ) {
            loud = false;

            const now = performance.now();

            if (
              !saving &&
              now - lastPoint >= COOLDOWN_MS
            ) {
              lastPoint = now;
              addPoint();
            }
          }

          frame = requestAnimationFrame(tick);
        }

        tick();
      }

      async function addPoint() {
        if (saving || !identity) return;

        saving = true;

        try {
          const { data, error } = await db
            .from("players")
            .select("score")
            .eq("room", identity.room)
            .eq("name", identity.name)
            .single();

          if (error) throw error;

          const nextScore =
            (Number(data.score) || 0) + 1;

          const { error: updateError } = await db
            .from("players")
            .update({
              score: nextScore
            })
            .eq("room", identity.room)
            .eq("name", identity.name)
            .select("score")
            .single();

          if (updateError) throw updateError;

          if (running) {
            $("status").textContent =
              identity.name +
              ": +1 очко! Всего: " +
              nextScore;
          }

          await loadScores();
        } catch (error) {
          showError(error);
        } finally {
          saving = false;
        }
      }

      async function loadScores() {
        if (!identity) return;

        const version = ++loadVersion;

        try {
          const { data, error } = await db
            .from("players")
            .select("name, score, avatar")
            .eq("room", identity.room);

          if (error) throw error;

          if (version !== loadVersion) return;

          renderScores(data || []);
        } catch (error) {
          if (version === loadVersion) {
            showError(error);
          }
        }
      }

      function subscribe() {
        channel = db
          .channel("party-" + crypto.randomUUID())
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "players"
            },
            () => {
              loadScores();
            }
          )
          .subscribe(status => {
            if (status === "SUBSCRIBED") {
              loadScores();
            }
          });

        if (timer) {
          clearInterval(timer);
        }

        // Резервное обновление при сбое Realtime.
        timer = setInterval(() => {
          loadScores();
        }, 5000);
      }

      function createCard(name) {
        const item = document.createElement("li");
        item.className = "player";

        const score = document.createElement("div");
        score.className = "score";

        const stage = document.createElement("div");
        stage.className = "stage";

        const track = document.createElement("div");
        track.className = "track";

        const inner = document.createElement("div");
        inner.className = "track-inner";

        const fill = document.createElement("div");
        fill.className = "fill";

        const avatar = document.createElement("div");
        avatar.className = "avatar";

        const label = document.createElement("div");
        label.className = "name";
        label.textContent = name;
        label.title = name;

        inner.appendChild(fill);
        track.appendChild(inner);
        stage.append(track, avatar);
        item.append(score, stage, label);

        return {
          item,
          score,
          fill,
          avatar,
          avatarKey: null
        };
      }

      function renderScores(players) {
        const sorted = [...players].sort((a, b) =>
          a.name.localeCompare(b.name, "ru")
        );

        $("empty").hidden = sorted.length > 0;

        const activeNames = new Set(
          sorted.map(player => player.name)
        );

        for (const [name, card] of cards) {
          if (!activeNames.has(name)) {
            card.item.remove();
            cards.delete(name);
          }
        }

        const container = $("players");

        sorted.forEach((player, index) => {
          let card = cards.get(player.name);

          if (!card) {
            card = createCard(player.name);
            cards.set(player.name, card);
          }

          const avatarKey = AVATARS[player.avatar]
            ? player.avatar
            : "green";

          const avatar = AVATARS[avatarKey];

          const score =
            Number(player.score) || 0;

          if (card.avatarKey !== avatarKey) {
            card.avatarKey = avatarKey;

            card.avatar.innerHTML =
              avatarSVG(avatarKey);

            card.item.style.setProperty(
              "--color",
              avatar.color
            );
          }

          const scoreText = String(score);

          if (card.score.textContent !== scoreText) {
            card.score.textContent = scoreText;
          }

          card.fill.style.height =
            Math.max(
              0,
              Math.min(
                100,
                score / MAX_SCORE * 100
              )
            ) + "%";

          const current =
            container.children[index];

          if (current !== card.item) {
            container.insertBefore(
              card.item,
              current || null
            );
          }
        });
      }

      $("start").addEventListener("click", start);
      $("stop").addEventListener("click", stop);

      window.addEventListener("pagehide", () => {
        stop();

        if (timer) {
          clearInterval(timer);
        }

        if (channel && db) {
          db.removeChannel(channel);
        }
      });

      renderChoices();
      init();
    })();
  </script>
</body>
